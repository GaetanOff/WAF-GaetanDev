# WAF config for the local docker-compose test stack.
# Differs from configs/config.example.yaml: Cloudflare trust is OFF so you can
# curl the WAF directly (no CF-Connecting-IP spoofing protection in front).
# Do NOT use this as a production config.

version: "1.0"

server:
  listen: ":8080"
  admin_listen: "0.0.0.0:9090"   # reachable inside the compose network only
  read_timeout: "30s"
  write_timeout: "30s"
  idle_timeout: "60s"
  graceful_shutdown_timeout: "15s"

upstream:
  address: "http://nginx:80"
  timeout: "30s"
  tls_verify: false
  max_idle_conns: 100

cloudflare:
  trusted: false                 # direct access for local testing
  auto_update_ranges: false   # true = rafraîchit les plages depuis cloudflare.com (exige trusted)
  update_interval: "24h"      # >= 1m quand auto_update_ranges est actif

rate_limit:
  enabled: true
  requests_per_second: 50
  burst: 100
  requests_per_minute: 1000   # fenêtre minute (0 = désactivée)
  requests_per_hour: 10000    # fenêtre heure (0 = désactivée, doit être >= requests_per_minute)

antiddos:
  enabled: true
  global_requests_per_second: 50000
  global_window: "1s"
  retry_after_seconds: 5

trust:
  initial_score: 50
  challenge_threshold: 40
  block_threshold: 10
  score_ttl: "1h"
  max_visitors: 100000

challenge:
  enabled: true
  token_ttl: "30s"
  cookie_ttl: "24h"
  cookie_name: "waf_session"
  pow_difficulty: 16
  min_elapsed_ms: 500
  max_elapsed_ms: 10000

admin:
  enabled: true

storage:
  backend: "memory"

whitelist:
  - "127.0.0.1"
  - "::1"

blacklist: []

whitelist_user_agents:
  - "Googlebot"
  - "Bingbot"
  - "UptimeRobot"

honeypot_paths:
  - "/.env"
  - "/wp-login.php"
  - "/.git/config"

logging:
  level: "info"
  format: "json"
  output: "stdout"
