# WAF Anti-DDoS / Anti-Bot — Configuration example
# Voir specs/schemas/config.schema.json pour le schéma complet
# Les secrets sensibles doivent être fournis via variables d'environnement :
#   WAF_CHALLENGE_SECRET_KEY=<32+ chars>
#   WAF_ADMIN_TOKEN=<32+ chars>
#   WAF_REDIS_PASSWORD=<password>

version: "1.0"

server:
  listen: ":8080"              # Port public (derrière Cloudflare)
  admin_listen: "127.0.0.1:9090"  # API admin — NE PAS exposer publiquement
  read_timeout: "30s"
  write_timeout: "30s"
  idle_timeout: "60s"
  graceful_shutdown_timeout: "15s"
  # Terminaison TLS par domaine (FR-33) : opt-in, si le WAF n'est PAS derrière
  # un terminateur TLS amont. Le certificat est choisi par SNI via domains[].tls.
  tls:
    enabled: false
    listen: ":443"
    min_version: "1.2"         # "1.2" | "1.3"
    cipher_suites: []          # vide = défaut sécurisé Go (TLS 1.2)
    redirect_http: true        # 301 HTTP -> HTTPS
    cert_file: ""              # certificat par défaut (SNI sans correspondance)
    key_file: ""

# Upstream par défaut (si aucun domaine ne correspond)
upstream:
  address: "http://nginx:80"
  timeout: "30s"
  tls_verify: true
  max_idle_conns: 100
  preserve_host: false         # true = conserve le Host entrant (upstream routant par vhost)

# Intégration Cloudflare
cloudflare:
  trusted: true               # Faire confiance à CF-Connecting-IP
  auto_update_ranges: false   # true = fetch https://www.cloudflare.com/ips-v4 toutes les 24h
  update_interval: "24h"

# Rate limiting global (Token Bucket par IP)
rate_limit:
  enabled: true
  requests_per_second: 50    # Tokens ajoutés par seconde
  burst: 100                 # Capacité max du bucket (spike autorisé)
  requests_per_minute: 1000
  requests_per_hour: 10000

# Protection Anti-DDoS globale
antiddos:
  enabled: true
  global_requests_per_second: 50000  # Baseline globale pour calculer la pression adaptative
  global_window: "1s"                # Fenêtre glissante du compteur global
  pressure_levels:
    elevated_multiplier: 1           # >= 50k req/s -> pression elevated
    high_multiplier: 2               # >= 100k req/s -> pression high
    critical_multiplier: 4           # >= 200k req/s -> pression critical
  retry_after_seconds: 5             # Retry-After pour les limites explicites par IP, pas pour un 503 global
  # Mode "sous attaque" (FR-39) : sous pression avérée, force le challenge JS des
  # requêtes sans clearance (cookie/bot vérifié/whitelist/sticky trust) pour
  # délester un flood L7 distribué tout en laissant les humains récupérer via PoW.
  under_attack:
    enabled: true
    scope: "per_domain"              # per_domain (circonscrit au domaine attaqué) | global
    trigger_pressure: "high"         # elevated | high | critical — entrée en mode
    exit_pressure: "elevated"        # plancher d'hystérésis pour sortir du mode
    cooldown: "30s"                  # durée sous exit_pressure avant de quitter le mode
    shadow: false                    # true = calcule/journalise sans forcer (calibration, FR-38)
    max_tracked_domains: 1024        # plafond LRU des compteurs par domaine

# Système de confiance et challenge
trust:
  initial_score: 50
  challenge_threshold: 40    # En dessous → challenge JS déclenché
  block_threshold: 10        # En dessous → HTTP 403
  score_ttl: "1h"
  max_visitors: 100000       # LRU eviction au-delà

# Moteur de risque (fusion des signaux, profil balanced par defaut)
risk_engine:
  enabled: true
  profile: "balanced"        # lenient | balanced | strict
  shadow_mode: true          # calibration : calcule/journalise sans appliquer (NFR-15, >= 24h avant enforcement)
  block_min_confidence: 0.6
  min_corroborating_families: 2
  tiers:
    observe: 25
    throttle: 45
    challenge: 65
    tarpit: 80
    block: 90
  weights:
    reputation: 1.0
    behavioral: 1.0
    tls: 0.8
    fingerprint: 1.0
    integrity: 1.2
    rate: 0.6
    geo: 0.5
    human_credit: 1.0
  family_corroboration_threshold: 50
  human_credit:
    challenge_passed: -40
    stable_fingerprint: -15
    sticky_trust_ttl: "30m"
  verified_bots:
    enabled: true
    success_cache_ttl: "12h"
    failure_cache_ttl: "10m"
    crawlers:
      - "googlebot"
      - "bingbot"
      - "duckduckbot"
      - "applebot"

# Analyse d'integrite des requetes (FR-18) : obfuscation, injection, tailles
integrity:
  enabled: true
  max_body_bytes: 10485760   # 10 MB
  max_path_length: 2048
  max_query_length: 4096

# Analyse comportementale (FR-12) : 6 signaux sur les N dernieres requetes
behavioral:
  enabled: true
  max_records: 50

# Threat intelligence (FR-13) : feeds locaux + AbuseIPDB (opt-in)
threat_intel:
  enabled: false             # activer apres avoir fourni feeds et/ou cle API
  cache_ttl: "1h"
  blocklist_cidrs: []        # plages malveillantes (verdict malicious)
  suspect_cidrs: []          # Tor / datacenter / VPN (verdict suspect)
  abuseipdb:
    enabled: false
    url: "https://api.abuseipdb.com/api/v2/check"
    api_key: ""              # preferer une injection via secret/env

# Difficulte de PoW adaptative (FR-14) : monte sous attaque, redescend (decay)
adaptive:
  enabled: true
  max_difficulty: 16         # plafond de bits sous attaque critique
  decay_tau: "5m"            # constante de temps de retour au niveau normal

# Regles geographiques (FR-16) : base sur CF-IPCountry (ignore si absent)
geo:
  enabled: false             # opt-in
  allowed_countries: []      # si non vide : mode whitelist (les autres -> 403)
  blocked_countries: []      # pays -> HTTP 403
  challenge_countries: []    # pays -> contribution de risque renforcee
  challenge_contribution: 60

# Fingerprinting TLS / JA3 (FR-11) : via header Cloudflare Bot Management
tls_fingerprint:
  enabled: true
  ja3_header: "Cf-Bot-Management-Ja3Hash"
  ja3_blacklist: []          # hashes JA3 malveillants connus -> BLOCK deterministe
  swap_contribution: 50      # changement de JA3 entre sessions -> contribution tls

# Couche de deception (FR-15) : tarpit pour les requetes classees TARPIT
deception:
  enabled: true
  tarpit_max_connections: 500   # plafond de connexions tarpitees simultanees (NFR-10)
  tarpit_chunks: 20             # nombre de chunks HTML envoyes
  tarpit_chunk_delay: "1s"      # delai entre chunks

# Moteur de regles personnalisees (FR-17) : DSL YAML (cf. schemas/rule.schema.json)
rules:
  enabled: false             # opt-in
  file: ""                   # chemin du fichier YAML de regles (rechargeable a chaud)

# Protection de l'origine (FR-19) : token HMAC rotatif injecte vers l'upstream
origin_protection:
  enabled: false             # opt-in
  # secret: "change-me-min-16-chars"  # preferer WAF_ORIGIN_SECRET (env)

# Synchronisation multi-noeuds (FR-20) : Redis Pub/Sub (necessite storage.redis)
cluster:
  enabled: false             # opt-in
  channel: "waf:events"

# En-tetes de securite + sanitisation des reponses (FR-21, FR-22)
security_headers:
  enabled: true
  hsts_max_age: 31536000
  hsts_include_subdomains: true
  frame_options: "DENY"
  content_type_nosniff: true
  referrer_policy: "strict-origin-when-cross-origin"
  permissions_policy: ""
  csp: ""                    # opt-in : ne pas activer sans tester
  strip_headers: ["Server", "X-Powered-By"]

# Protection Slowloris / Slow POST (FR-23)
slowloris:
  enabled: true
  max_connections_per_ip: 50
  header_timeout: "10s"

# Bypass des assets statiques (FR-24) : evite de challenger le CSS/JS de la page
static_assets:
  enabled: true
  extensions: [".css", ".js", ".png", ".jpg", ".jpeg", ".gif", ".svg", ".ico", ".woff", ".woff2", ".ttf", ".eot", ".map", ".webp"]

# Pool d'upstreams + health checks + load balancing (FR-25, FR-26)
upstream_pool:
  enabled: false             # opt-in : prend la priorite sur upstream/domains
  strategy: "round_robin"    # round_robin | least_conn | ip_hash | weighted
  upstreams: []              # - { address: "http://10.0.0.1:80", weight: 1, backup: false }
  health_check:
    path: "/healthz"
    interval: "10s"
    timeout: "2s"
    healthy_threshold: 2
    unhealthy_threshold: 3

# Audit trail des actions admin (FR-27) : journal append-only, secrets masques
audit:
  enabled: true
  max_entries: 1000
  file: ""                   # chemin optionnel d'export (sinon memoire seule)

# Conformite RGPD (FR-28) : anonymisation des IP dans les logs (/24, /48)
gdpr:
  anonymize_ip: true         # l'ip_hash reste pour la correlation
  # Effacement : POST /waf/admin/gdpr/erase {"ip": "..."}
  # Retention : assuree par trust.score_ttl (purge du store) ; registre: specs/gdpr-register.md

# Alerting webhooks (FR-29) : Slack / Discord / generique, retry + cooldown
alerting:
  enabled: false             # opt-in
  cooldown: "5m"             # deduplication par trigger+domaine
  max_retries: 3
  webhooks: []               # - { type: "slack", url: "https://hooks.slack.com/..." }

# Auto-protection du WAF (FR-30) : flood /waf/verify + brute-force admin
self_protection:
  enabled: true
  verify_max_per_minute: 60  # POST /waf/verify max par IP et par minute
  admin_max_failures: 5      # echecs d'auth admin avant verrouillage
  admin_lockout: "5m"        # duree de verrouillage

# ACME / Let's Encrypt (FR-31) : TLS direct (hors Cloudflare), renouvellement auto
acme:
  enabled: false             # opt-in : si le WAF termine lui-meme le TLS
  domains: []                # - "example.com"
  email: ""
  cache_dir: "./certs"
  tls_listen: ":443"
  http_challenge_listen: ":80"

# Mode maintenance + pages d'erreur personnalisees brandees (FR-32)
maintenance:
  enabled: false             # true = page 503 maintenance pour tout le trafic
  error_pages: true          # remplace les corps d'erreur (4xx/5xx) par une page HTML brandee

# Challenge JavaScript
challenge:
  enabled: true
  # secret_key: "change-me-in-production-min-32-chars" # Préférer env var
  token_ttl: "90s"           # Durée de validité du nonce
  cookie_ttl: "24h"          # Durée du cookie de session
  cookie_name: "waf_session"
  pow_difficulty: 16         # 16 bits ≈ 500ms sur CPU standard
  min_elapsed_ms: 0          # 0 = plancher désactivé (recommandé). >0 rejette les résolutions trop rapides (faux positifs sur clients rapides)
  max_elapsed_ms: 60000      # Trop lent = abandon (marge large pour appareils lents)

# API Admin
admin:
  enabled: true
  # token: "change-me-in-production-min-32-chars" # Préférer env var

# Stockage de l'état visiteurs
storage:
  backend: "memory"          # "memory" (défaut) ou "redis"
  # redis:
  #   address: "redis:6379"
  #   password: ""           # Préférer WAF_REDIS_PASSWORD env var
  #   db: 0
  #   tls: false

# IPs et CIDRs toujours autorisés (bypass total)
whitelist:
  - "127.0.0.1"
  - "::1"
  # - "10.0.0.0/8"           # Réseau interne
  # - "192.168.0.0/16"       # LAN

# IPs et CIDRs toujours bloqués (HTTP 403)
blacklist: []
  # - "1.2.3.4"
  # - "198.51.100.0/24"

# User-agents de bots légitimes (bypass challenge)
whitelist_user_agents:
  - "Googlebot"
  - "Bingbot"
  - "Slurp"                  # Yahoo
  - "DuckDuckBot"
  - "Baiduspider"
  - "facebookexternalhit"
  - "LinkedInBot"
  - "Twitterbot"
  - "Applebot"
  - "UptimeRobot"            # Monitoring

# Chemins honeypot : toute requête → score = 0 + log + bloc
honeypot_paths:
  - "/.env"
  - "/.env.local"
  - "/.env.production"
  - "/wp-admin"
  - "/wp-login.php"
  - "/wp-config.php"
  - "/.git/config"
  - "/phpinfo.php"
  - "/admin.php"
  - "/config.php"
  - "/.htaccess"
  - "/xmlrpc.php"
  - "/shell.php"
  - "/c99.php"

# Configuration par domaine (surcharge les valeurs globales)
domains:
  - host: "example.com"
    upstream: "http://10.0.0.1:80"
    challenge_enabled: true
    # Certificat TLS de ce domaine, présenté par SNI si server.tls.enabled (FR-33)
    # tls:
    #   cert_file: "/etc/waf/certs/example.com/fullchain.pem"
    #   key_file: "/etc/waf/certs/example.com/privkey.pem"
    # Chemins qui déclenchent TOUJOURS le challenge (sensibles)
    protected_paths:
      - "/api/"
      - "/account/"
    # Chemins qui ne déclenchent JAMAIS le challenge (assets statiques)
    public_paths:
      - "/static/"
      - "/favicon.ico"
      - "/robots.txt"
      - "/sitemap.xml"

  - host: "api.example.com"
    upstream: "http://10.0.0.2:8000"
    challenge_enabled: false   # API — pas de challenge JS
    rate_limit_override:
      requests_per_second: 20  # Plus restrictif pour l'API
      burst: 40
    trust_override:
      block_threshold: 20      # Plus agressif sur l'API

  - host: "*.example.com"
    upstream: "http://10.0.0.3:80"
    challenge_enabled: true

# Logging
logging:
  level: "info"              # debug | info | warn | error
  format: "json"             # json (production) | pretty (développement)
  output: "stdout"           # stdout | stderr
