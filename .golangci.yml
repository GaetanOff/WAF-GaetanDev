# golangci-lint configuration (schema v2) — WAF Anti-DDoS / Anti-Bot
# Conservative, idiomatic linter set aligned with .cursor/rules/specific-go.mdc.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  # The "standard" default set already enables errcheck, govet, ineffassign,
  # staticcheck and unused; we only add the extras on top.
  enable:
    - bodyclose # http.Response.Body closed
    - errorlint # error wrapping (%w) correctness
    # NB: `misspell` n'est pas activé — il est anglophone uniquement et
    # signale à tort les commentaires en français (convention du projet).
  exclusions:
    rules:
      # Test files may ignore errors on best-effort helpers.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  # gofmt/goimports are formatters in golangci-lint v2, not linters.
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
